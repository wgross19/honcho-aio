schema_version: 1
repo: honcho-aio
github_repo: wgross19/honcho-aio
app_slug: honcho-aio
image:
  name: dub19/honcho-aio
  cache_scope: honcho-aio-image
  pytest_tag: honcho-aio:pytest
  publish_platforms: linux/amd64,linux/arm64
release:
  name: Honcho AIO
  profile: changelog-version
  previous_tag_command: latest-aio-tag
upstream:
  name: Honcho
  version_key: HONCHO_VERSION
  digest_arg: UPSTREAM_IMAGE_DIGEST
  monitor:
    - component: honcho
      name: Honcho
      source: github-tags
      repo: plastic-labs/honcho
      version_key: HONCHO_VERSION
      stable_only: true
      strategy: pr
      release_notes_url: https://github.com/plastic-labs/honcho/releases
template:
  xml_paths:
    - honcho-aio.xml
  generated: false
catalog:
  published: true
  assets:
    - source: honcho-aio.xml
      target: honcho-aio.xml
    - source: assets/app-icon.png
      target: icons/honcho.png
tests:
  integration: tests/integration -m integration --timeout=90
  checkout_submodules: false
